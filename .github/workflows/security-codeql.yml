name: Security / CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - "commerce/**"
      - "packages/**"
      - "scripts/**"
      - ".github/codeql/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "commerce/**"
      - "packages/**"
      - "scripts/**"
      - ".github/codeql/**"
      - ".github/workflows/**"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze and publish code scanning results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  analyze-actions:
    name: CodeQL GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Initialize CodeQL for Actions
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Analyze workflow files
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
