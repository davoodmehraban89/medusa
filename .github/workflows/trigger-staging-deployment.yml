name: Trigger Staging Deployment

on:
  workflow_run:
    workflows: [Trigger Release and Publish]
    types:
      - completed

jobs:
  deploy:
    # Imported action posts to the upstream medusajs/staging repository.
    # Never dispatch owner-unrelated deployments from the Medusa store fork.
    if: github.repository == 'medusajs/medusa' && github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.STAGING_DEPLOY_ACCESS_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/medusajs/staging/actions/workflows/deploy.yml/dispatches \
          -d '{"ref":"main"}'