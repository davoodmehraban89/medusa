name: One-time Medusa source import
on:
  push:
    paths:
      - .github/workflows/import-medusa-source.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Download exact source ZIP
        run: |
          python -m pip install --quiet gdown
          gdown --id 1s21CvVWexMKfHp3qU0SNc0GDTi0_BnuI --output /tmp/medusa-develop.zip
          test "$(stat -c%s /tmp/medusa-develop.zip)" = 61017629
      - name: Extract source without rewriting files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          root=Path.cwd().resolve()
          with ZipFile('/tmp/medusa-develop.zip') as z:
              files=[i for i in z.infolist() if not i.is_dir()]
              assert len(files)==24261, f'Unexpected file count: {len(files)}'
              assert z.testzip() is None
              for info in files:
                  path=Path(info.filename)
                  assert path.parts[0]=='medusa-develop' and len(path.parts)>1
                  relative=Path(*path.parts[1:])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  dest=(root/relative).resolve()
                  assert dest.is_relative_to(root)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as src, dest.open('wb') as dst:
                      shutil.copyfileobj(src,dst)
          print('Extracted',len(files),'files')
          PY
      - name: Commit imported source and remove temporary workflow
        run: |
          rm .github/workflows/import-medusa-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import original Medusa source archive without modifications"
          git push origin HEAD:main
