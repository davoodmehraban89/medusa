name: Security / Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan incoming commits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR history for diff scanning
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect exposed credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public personal-account repo: no Gitleaks license is required.
          # Never put potential secret values in public PR comments/artifacts.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  baseline-history:
    name: Scan complete reachable Git history
    # PR verification tests the imported history immediately; schedule and
    # manual triggers provide follow-up scans after the workflow lands on main.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history; report location metadata only
        shell: bash
        run: |
          set -euo pipefail
          # Save the raw JSON only in the ephemeral runner directory. It is never
          # uploaded, commented, or printed, even though Gitleaks redacts matches.
          set +e
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP:/audit" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --log-opts="--all" --redact --no-banner \
            --report-format json --report-path /audit/gitleaks-redacted.json --exit-code=1
          SCAN_STATUS=$?
          set -e
          node scripts/security/triage-gitleaks-report.mjs "$RUNNER_TEMP/gitleaks-redacted.json"
          # Keep CI red if Gitleaks found something or encountered an error.
          exit "$SCAN_STATUS"
