name: Preview / Commerce GitHub Pages

on:
  push:
    branches:
      - project/medusa-foundation-audit
    paths:
      - "commerce/**"
      - ".github/workflows/commerce-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: commerce-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and publish storefront preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install standalone storefront dependencies
        working-directory: commerce
        run: npm install --no-audit --no-fund
      - name: Test storefront
        working-directory: commerce
        run: npm test
      - name: Typecheck and build for repository subpath
        working-directory: commerce
        # Explicit /medusa/ asset base keeps Vite JS/CSS working on project Pages.
        # No API keys / commerce payments are enabled in this public preview.
        run: npm run build -- --base=/medusa/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: commerce/dist
      - name: Publish public preview
        id: deployment
        uses: actions/deploy-pages@v4
